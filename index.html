<!DOCTYPE html>
<html lang="en" data-g="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0907">
<title>Coach Ahmed Maher</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Poppins:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=13">
<link rel="stylesheet" href="assets/langs.css?v=13">
<link rel="stylesheet" href="assets/hub.css?v=13">
<script>try{var g=localStorage.getItem("amw-g");if(g)document.documentElement.dataset.g=g;}catch(e){}</script>
</head>
<body>
<section class="band">
  <div class="coachpic" aria-hidden="true"><img src="images/coach.jpg" alt="" draggable="false"></div>
  <div class="bar-top">
    <div class="pills"></div>
    <div class="langwrap">
      <button type="button" class="pill" id="globe" aria-haspopup="true" aria-expanded="false" aria-controls="langmenu">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3Z"/></svg>
        <span id="langname">English</span>
      </button>
      <div class="langmenu" id="langmenu" role="menu" hidden></div>
    </div>
  </div>
  <div class="band-in">
    <div>
      <span class="role" data-i="role">Coach</span>
      <h1 class="word" dir="ltr"><span class="solid">AHMED</span><span class="outline">MAHER</span></h1>
      <p class="tagline" data-i="tagline"></p>
      <div class="contact" id="contact"></div>
    </div>
    <div class="panel">
      <!-- step 1: man / woman -->
      <div class="step" id="st1">
        <span class="stepno" data-i="s1">Step 1 of 3</span>
        <h2 data-i="chooseTitle">Who's training today?</h2>
        <p data-i="chooseSub"></p>
        <div class="gpick">
          <button type="button" class="gbtn m" data-gender="m" aria-pressed="false">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><circle cx="20" cy="28" r="12"/><path d="M29 19 41 7M30 7h11v11"/></svg>
            <span data-i="man">Man</span></button>
          <button type="button" class="gbtn f" data-gender="f" aria-pressed="false">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><circle cx="24" cy="18" r="12"/><path d="M24 30v14M17 38h14"/></svg>
            <span data-i="woman">Woman</span></button>
        </div>
      </div>
      <!-- step 2: workout / nutrition / report -->
      <div class="step" id="st2">
        <div class="stephead"><span class="stepno" data-i="s2">Step 2 of 3</span><button type="button" class="chg" data-back="st1"><span class="gi"></span><span class="gn"></span> · <span data-i="change">Change</span></button></div>
        <h2 data-i="pickTitle">What do you want to open?</h2>
        <p data-i="pickSub"></p>
        <div class="secs">
          <button type="button" class="sec sw" data-sec="w">
            <span class="sico" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M6 18v12M12 13v22M36 13v22M42 18v12M12 24h24"/></svg></span>
            <span class="stx"><b data-i="secW">My workout</b><small data-i="secWs"></small></span><span class="sarr" aria-hidden="true">›</span></button>
          <button type="button" class="sec sn" data-sec="n">
            <span class="sico" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 14c-6-6-16-2-16 8 0 10 8 20 16 20s16-10 16-20c0-10-10-14-16-8Z"/><path d="M24 14c0-4 2-7 6-8"/></svg></span>
            <span class="stx"><b data-i="secN">My nutrition</b><small data-i="secNs"></small></span><span class="sarr" aria-hidden="true">›</span></button>
          <button type="button" class="sec sr" data-sec="r">
            <span class="sico" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 40h32"/><path d="M12 34V24M20 34V18M28 34V26M36 34V12"/></svg></span>
            <span class="stx"><b data-i="secR">My report</b><small data-i="secRs"></small></span><span class="sarr" aria-hidden="true">›</span></button>
        </div>
      </div>
      <!-- step 3: code -->
      <form class="step" id="st3" autocomplete="off">
        <div class="stephead"><span class="stepno" data-i="s3">Step 3 of 3</span><button type="button" class="chg" data-back="st2"><span id="secname"></span> · <span data-i="change">Change</span></button></div>
        <h2 data-i="codeTitle">Your code</h2>
        <p data-i="codeSub"></p>
        <label for="code" style="position:absolute;left:-9999px" data-i="codeLabel">Client code</label>
        <div class="search" dir="ltr">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7b8592" stroke-width="2" style="align-self:center;margin-left:8px" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="code" placeholder="e.g. HIBA-7K4Q2M" maxlength="40" spellcheck="false" autocapitalize="characters">
          <button type="submit" id="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span data-i="open">Open</span></button>
        </div>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
        <button type="button" class="linkbtn" id="other" hidden data-i="signOut">Use another code</button>
        <div class="legal"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="flex:none;margin-top:1px"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span id="legal"></span></div>
      </form>
    </div>
  </div>
</section>

<section class="adwrap">
  <a class="ad" id="ad" target="_blank" rel="noopener">
    <span class="ad-bg" aria-hidden="true">RECOVERY</span>
    <span class="ad-icon" aria-hidden="true"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s-7.5-4.6-9.3-9.4C1.4 8 3.6 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.7 1.2-1.6 2.8-2.7 4.8-2.7 3.6 0 5.8 3.5 4.5 7.1C19.5 16.4 12 21 12 21Z"/><path d="M3.5 12h4l2-3 3 6 2-3h6"/></svg></span>
    <span class="ad-text"><span class="ad-eyebrow" data-i="adEyebrow">Recovery</span><span class="ad-title" data-i="adTitle">Book your recovery session</span><span class="ad-sub" data-i="adText"></span></span>
    <span class="ad-btn"><span data-i="adBtn">Book now</span><svg class="arr" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
  </a>
</section>

<footer class="sitefoot"><span id="copy"></span><span data-i="foot2"></span></footer>

<script src="assets/config.js?v=13"></script>
<script src="assets/i18n.js?v=13"></script>
<script src="assets/i18n-more.js?v=13"></script>
<script src="assets/hub-i18n.js?v=13"></script>
<script src="nutrition/data/clients.enc.js?v=13"></script>
<script src="assets/hub.js?v=13"></script>
</body>
</html>
